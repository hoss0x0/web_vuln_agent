patterns:
  - type: email
    pattern: '\b[\w.-]+@[\w.-]+\.\w+\b'
    replacement: '[EMAIL]'
    description: 'Email addresses'
    priority: 1
    enabled: true

  - type: phone
    pattern: '\b(?:\+\d{1,3}[-.]?)?\(?\d{3}\)?[-.]?\d{3}[-.]?\d{4}\b'
    replacement: '[PHONE]'
    description: 'Phone numbers'
    priority: 2
    enabled: true

  - type: ssn
    pattern: '\b\d{3}[-.]?\d{2}[-.]?\d{4}\b'
    replacement: '[SSN]'
    description: 'Social Security Numbers'
    priority: 1
    enabled: true

  - type: credit_card
    pattern: '\b(?:\d[ -]*?){13,16}\b'
    replacement: '[CREDIT_CARD]'
    description: 'Credit card numbers'
    priority: 1
    enabled: true

  - type: address
    pattern: '\b\d+\s+[A-Za-z\s,]+(Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr)\b'
    replacement: '[ADDRESS]'
    description: 'Street addresses'
    priority: 3
    enabled: true

  - type: name
    pattern: '\b(?:Mr\.|Mrs\.|Ms\.|Dr\.|Prof\.)\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\b'
    replacement: '[NAME]'
    description: 'Full names with titles'
    priority: 3
    enabled: true

  - type: date_of_birth
    pattern: '\b\d{2}[-/]\d{2}[-/]\d{4}\b'
    replacement: '[DOB]'
    description: 'Dates of birth'
    priority: 2
    enabled: true

  - type: ip_address
    pattern: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
    replacement: '[IP_ADDRESS]'
    description: 'IP addresses'
    priority: 2
    enabled: true

  - type: passport
    pattern: '\b[A-Z]\d{7}\b'
    replacement: '[PASSPORT]'
    description: 'Passport numbers'
    priority: 1
    enabled: true

  - type: bank_account
    pattern: '\b\d{8,12}\b'
    replacement: '[BANK_ACCOUNT]'
    description: 'Bank account numbers'
    priority: 1
    enabled: true

sensitive_types:
  - ssn
  - credit_card
  - bank_account
  - passport